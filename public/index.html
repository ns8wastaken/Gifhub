<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gifhub</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="app">
            <!-- Titlebar -->
            <div id="titlebar">
                <label for="file-input">+ add</label>
                <input id="file-input" type="file" accept="image/*,.gif" required style="display:none">
                <span class="title">GIFHUB</span>
            </div>

            <!-- Sidebar -->
            <div id="sidebar">
                <div id="sidebar-header">Tags</div>
                <div id="tag-list">
                    <div class="tag-item active" id="all-item" data-tag="">
                        <span class="tag-name">all</span>
                        <span class="tag-count" id="all-count">0</span>
                    </div>
                </div>
            </div>

            <!-- Main -->
            <div id="main">
                <div id="toolbar">
                    <input id="search" type="text" placeholder="search by name…">
                    <span id="count">0 items</span>
                </div>
                <div id="grid"></div>
            </div>
        </div>

        <!-- Drop overlay -->
        <div id="drop-overlay">drop files to add</div>

        <div id="modal-bg">
            <div id="modal">
                <div id="modal-header">
                    <span id="modal-filename">untitled</span>
                    <button id="modal-close">✕</button>
                </div>
                <div id="modal-preview-wrap">
                    <img id="modal-preview" src="" alt="preview">
                </div>
                <div id="modal-body">
                    <div>
                        <div class="section-label">tags</div>
                        <div id="modal-tag-input-row">
                            <input id="modal-tag-input" type="text" placeholder="add a tag…" maxlength="32" autocomplete="off" spellcheck="false">
                            <button id="modal-tag-add-btn">+ add</button>
                        </div>
                    </div>
                    <div id="modal-tag-list"></div>
                    <div class="modal-actions">
                        <button class="btn" id="modal-btn-cancel">cancel</button>
                        <button class="btn primary" id="modal-btn-save">save</button>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="dist/main.js"></script>
    </body>
</html>
